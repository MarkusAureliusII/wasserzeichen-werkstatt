name: Windows-Anwendung bauen

# Baut auf einem echten Windows-x64-Rechner. Wichtig, weil eine auf ARM gebaute
# exe auf einem gewöhnlichen Windows-PC nicht startet — x64 läuft dagegen überall,
# auch auf Windows-on-ARM.
#
# Auslöser:
#   - Tag "v1.2.3" pushen  -> baut und hängt die Dateien an ein Release
#   - Von Hand über "Actions" -> baut nur, ohne Release (zum Ausprobieren)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # nötig, um das Release anzulegen

jobs:
  bauen:
    runs-on: windows-latest

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Version einlesen
        id: version
        shell: pwsh
        run: |
          # Erlaubt sind 1.2.3 und Vorabversionen wie 1.2.3-beta.1 oder 1.2.3-rc.2.
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "version.txt enthält keine gültige Version: '$v'"
          }
          $vorab = $v.Contains("-")
          "version=$v"   >> $env:GITHUB_OUTPUT
          "vorab=$vorab" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v (Vorabversion: $vorab)"

      - name: Tag gegen version.txt prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $datei = "${{ steps.version.outputs.version }}"
          if ($tag -ne $datei) {
            throw "Tag v$tag und version.txt ($datei) passen nicht zusammen. Bitte version.txt anpassen."
          }
          Write-Host "Tag und version.txt stimmen überein."

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Bibliotheken installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement windows/anforderungen.txt

      - name: ffmpeg holen
        shell: pwsh
        run: |
          # GPL-Build, weil der LGPL-Build kein libx264 enthält — das brauchen wir
          # zum Umkodieren unter Windows. Herkunft und Lizenz werden mit ausgeliefert.
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          New-Item -ItemType Directory -Force -Path windows\werkzeuge | Out-Null
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe"  windows\werkzeuge\ -Force
          Copy-Item "$($bin.FullName)\ffprobe.exe" windows\werkzeuge\ -Force
          Get-Item windows\werkzeuge\*.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Anwendung packen
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build windows/wasserzeichen.spec

      - name: Anwendungscode und ffmpeg danebenlegen
        shell: pwsh
        run: |
          $ziel = "dist\Wasserzeichen"
          if (-not (Test-Path "$ziel\Wasserzeichen.exe")) { throw "Wasserzeichen.exe wurde nicht erzeugt." }
          New-Item -ItemType Directory -Force -Path "$ziel\app" | Out-Null
          Copy-Item oberflaeche.py, wasserzeichen.py, gestaltung.py, aktualisierung.py, version.txt, symbol.png "$ziel\app\" -Force
          Copy-Item windows\werkzeuge\ffmpeg.exe, windows\werkzeuge\ffprobe.exe $ziel -Force
          Copy-Item windows\ANLEITUNG.txt $ziel -Force
          $lizenz = @(
            "Dieses Programm liefert ffmpeg mit (unverändert, GPL-Build).",
            "Herkunft: https://github.com/BtbN/FFmpeg-Builds",
            "Quelltext von ffmpeg: https://git.ffmpeg.org/ffmpeg.git"
          )
          Set-Content "$ziel\FFMPEG-LIZENZ.txt" -Value $lizenz -Encoding UTF8

      - name: Lässt sich der ausgelieferte Code laden?
        shell: pwsh
        run: |
          # Ein Fenster geht auf einem Server nicht — der Importweg über app\ schon.
          $pruef = "pruefung.py"
          Set-Content $pruef -Encoding UTF8 -Value @(
            'import os, sys',
            'sys.path.insert(0, os.path.join("dist", "Wasserzeichen", "app"))',
            'import wasserzeichen as w',
            'print("Version:", w.VERSION)',
            'print("Fotoformate:", len(w.FOTO_ENDUNGEN | w.RAW_ENDUNGEN))',
            'assert w.VERSION != "0.0.0", "version.txt wurde nicht mit ausgeliefert"'
          )
          python $pruef
          Remove-Item $pruef

      - name: Update-Paket schnüren
        shell: pwsh
        run: |
          # Genau das lädt das Tool später bei einem kleinen Update: nur der Code.
          # Der Prüfschritt hat beim Importieren __pycache__ angelegt — das gehört
          # nicht ins Paket, sonst wandern fremde .pyc-Dateien mit.
          Get-ChildItem dist\Wasserzeichen\app -Recurse -Directory -Filter __pycache__ |
            Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force -Path ausgabe | Out-Null
          Compress-Archive -Path dist\Wasserzeichen\app\* -DestinationPath "ausgabe\app-${{ steps.version.outputs.version }}.zip" -Force
          $zip = Get-Item "ausgabe\app-${{ steps.version.outputs.version }}.zip"
          Write-Host ("Update-Paket: {0} KB" -f [math]::Round($zip.Length/1KB,1))

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ist fehlgeschlagen." }
          Copy-Item dist\installer\*.exe ausgabe\ -Force
          Get-Item ausgabe\* | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Ergebnisse aufbewahren
        uses: actions/upload-artifact@v4
        with:
          name: Wasserzeichen-${{ steps.version.outputs.version }}
          path: ausgabe/*
          retention-days: 30

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wasserzeichen ${{ steps.version.outputs.version }}
          files: ausgabe/*
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.vorab == 'True' }}
          body: |
            **Installieren:** `Wasserzeichen-${{ steps.version.outputs.version }}-Setup.exe` herunterladen und ausführen.

            Beim ersten Start meldet Windows sich einmal mit „Der Computer wurde geschützt" —
            auf *Weitere Informationen* und dann *Trotzdem ausführen* klicken. Das kommt nur einmal.

            `app-${{ steps.version.outputs.version }}.zip` ist das kleine Update-Paket, das
            das Programm sich später selbst holt. Es muss nicht von Hand geladen werden.

            ---
            Diese Fassung ist auf einem Windows-x64-Rechner gebaut und läuft damit auch
            auf Windows-on-ARM.
